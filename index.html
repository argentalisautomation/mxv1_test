<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MXV1 Smart Gateway</title>
    <link rel="manifest" href="manifest.json">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent: #38bdf8;
            --accent-glow: rgba(56, 189, 248, 0.2);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --btn-off: #334155;
            --btn-on: #0284c7;
            --grid-green: #22c55e;
            --inverter-amber: #f59e0b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: var(--bg-color); color: var(--text-main); padding: 1.5rem; max-width: 800px; margin: 0 auto; }
        
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; padding-bottom: 1rem; border-bottom: 1px solid #334155; }
        h1 { font-size: 1.5rem; font-weight: 700; color: var(--accent); }
        .btn-connect { background: var(--accent); color: #000; border: none; padding: 0.6rem 1.2rem; border-radius: 8px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
        .btn-connect:hover { opacity: 0.9; }

        .card { background: var(--card-bg); border-radius: 12px; padding: 1.2rem; margin-bottom: 1.2rem; border: 1px solid #334155; }
        .card h2 { font-size: 1.1rem; color: var(--text-muted); margin-bottom: 0.8rem; text-transform: uppercase; letter-spacing: 0.05em; }

        /* Power Metrics Grid */
        .power-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
        .metric-box { background: rgba(15, 23, 42, 0.6); padding: 1rem; border-radius: 8px; border-left: 4px solid var(--accent); }
        .metric-box.mains { border-left-color: var(--grid-green); }
        .metric-box.inverter { border-left-color: var(--inverter-amber); }
        .metric-title { font-size: 0.85rem; color: var(--text-muted); }
        .metric-val { font-size: 1.6rem; font-weight: 700; margin: 0.3rem 0; }
        .metric-sub { font-size: 0.8rem; color: var(--text-muted); }

        /* Relay Buttons Grid */
        .relay-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.8rem; }
        @media (max-width: 600px) { .relay-grid { grid-template-columns: repeat(2, 1fr); } }
        .relay-btn { background: var(--btn-off); color: var(--text-main); border: none; padding: 1.2rem 0.8rem; border-radius: 10px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: all 0.2s; text-align: center; }
        .relay-btn.active { background: var(--btn-on); box-shadow: 0 0 15px var(--accent-glow); }

        /* Radar Presence Bar */
        .radar-box { display: flex; align-items: center; justify-content: space-between; background: rgba(15, 23, 42, 0.6); padding: 1rem; border-radius: 8px; }
        .badge { padding: 0.3rem 0.8rem; border-radius: 20px; font-size: 0.85rem; font-weight: 700; }
        .badge.present { background: rgba(34, 197, 94, 0.2); color: var(--grid-green); }
        .badge.absent { background: rgba(148, 163, 184, 0.2); color: var(--text-muted); }

        /* OTA Section */
        .ota-box { display: flex; flex-direction: column; gap: 0.8rem; }
        .progress-bar-wrap { width: 100%; height: 10px; background: #334155; border-radius: 5px; overflow: hidden; display: none; }
        .progress-bar { width: 0%; height: 100%; background: var(--accent); transition: width 0.1s linear; }
    </style>
</head>
<body>
    <header>
        <div>
            <h1>MXV1 Controller</h1>
            <div id="statusText" style="font-size: 0.85rem; color: var(--text-muted);">Disconnected</div>
        </div>
        <button id="btnConnect" class="btn-connect">Connect BLE</button>
    </header>

    <!-- Power Monitoring -->
    <div class="card">
        <h2>Live Power Draw (Transient Stream)</h2>
        <div class="power-grid">
            <div class="metric-box mains">
                <div class="metric-title">AC MAINS (GRID)</div>
                <div class="metric-val" id="mainsWatts">0.0 W</div>
                <div class="metric-sub" id="mainsVolts">0.0 V</div>
            </div>
            <div class="metric-box inverter">
                <div class="metric-title">INVERTER LINE</div>
                <div class="metric-val" id="invWatts">0.0 W</div>
                <div class="metric-sub" id="invVolts">0.0 V</div>
            </div>
        </div>
    </div>

    <!-- 6-Channel Relays -->
    <div class="card">
        <h2>Relay Switches</h2>
        <div class="relay-grid">
            <button class="relay-btn" data-relay="0">Channel 1</button>
            <button class="relay-btn" data-relay="1">Channel 2</button>
            <button class="relay-btn" data-relay="2">Channel 3</button>
            <button class="relay-btn" data-relay="3">Channel 4</button>
            <button class="relay-btn" data-relay="4">Channel 5</button>
            <button class="relay-btn" data-relay="5">Channel 6</button>
        </div>
    </div>

    <!-- Radar Presence -->
    <div class="card">
        <h2>mmWave Radar Presence</h2>
        <div class="radar-box">
            <div>
                <div style="font-weight: 600;" id="radarDistance">Distance: -- cm</div>
                <div style="font-size: 0.8rem; color: var(--text-muted);">16-Gate Micro-Motion DSP</div>
            </div>
            <div class="badge absent" id="radarBadge">ABSENT</div>
        </div>
    </div>

    <!-- High-Speed BLE OTA -->
    <div class="card">
        <h2>Wireless Firmware Update (BLE OTA)</h2>
        <div class="ota-box">
            <input type="file" id="otaFileInput" accept=".bin" style="display: none;">
            <button id="btnSelectFw" class="btn-connect" style="background: #334155; color: white;">Select firmware.bin</button>
            <div class="progress-bar-wrap" id="progressWrap">
                <div class="progress-bar" id="progressBar"></div>
            </div>
            <div id="otaStatus" style="font-size: 0.85rem; color: var(--text-muted);"></div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
